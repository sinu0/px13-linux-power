# Force fine-grained runtime D3 (RTD3) for the RTX 4060 dGPU.
# NVIDIA 615.78.08 leaves the default (0x03) as "Disabled by default" on this
# HN7306WV unit, so the dGPU stays in D0 and draws ~6.5 W on battery even when
# idle. 0x02 enables fine-grained power control regardless of the driver's
# platform heuristic; the dGPU then reaches D3cold even while gnome-shell keeps
# /dev/nvidia0 open. Requires an initramfs rebuild and a reboot.
options nvidia NVreg_DynamicPowerManagement=0x02
