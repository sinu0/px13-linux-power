# SPDX-License-Identifier: MIT
# Opt-in: this ASUS ProArt PX13 (HN7306WV) unit only supports s2idle, not
# hardware S3. Enabling NVIDIA S0ix power management lets the dGPU be
# transitioned along with system suspend/resume on s2idle-only platforms.
# Installed only with `install.sh --enable-s0ix`. Requires an initramfs
# rebuild (e.g. `sudo mkinitcpio -P`) and a reboot to take effect.
options nvidia NVreg_EnableS0ixPowerManagement=1
