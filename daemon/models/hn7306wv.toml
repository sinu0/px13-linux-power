# SPDX-License-Identifier: MIT
#
# ASUS ProArt PX13 HN7306WV with an RTX 4060 Laptop GPU, BIOS 316.
# Every range here was verified on this board; see docs/FINDINGS.md. GPU clock
# ranges and power limits come from the NVIDIA driver at runtime. A new model
# needs its own file and its own DMI entry in the kernel module.

name = "PX13 Power"
default_profile = "Safe"

[match]
sys_vendor = "ASUSTeK COMPUTER INC."
board_name = "HN7306WV"

# AMD PPT limits the firmware accepts, in W.
[cpu]
sustained = { min = 5, max = 45 }
slow = { min = 5, max = 55 }
fast = { min = 5, max = 65 }

[gpu]
# Variable TGP on top of the firmware base TGP (55 W), in W.
tgp_offset = { min = 0, max = 40 }
dynamic_boost = { min = 5, max = 25 }
temperature = { min = 75, max = 87 }

# Outputs of the Quiet Gaming battery balance controller.
[battery_balance]
cpu_spl = { min = 12, max = 25 }
gpu_clock = { min = 1200, max = 2400 }

# The platform profile (Fn+F5, ROG Control Center, asusctl, or asusd's own
# switching on AC and battery) selects the mode. Each mode uses the first of
# its profiles whose requirements hold, otherwise the default profile.
[modes]
quiet = ["Quiet Gaming"]
balanced = ["Safe"]
performance = ["Gaming"]

# Conditions for changing limits by hand. Personal policies belong in
# /etc/px13-powerd/profiles.d, see examples/profiles.d.
[tuning]
requires = ["ac"]

# Profiles never overclock and never cap the CPU frequency; offsets and the
# GPU clock limit are opt-in through manual tuning.

[profiles.Safe]
platform_mode = 0
gpu_tgp_offset = 10
gpu_dynamic_boost = 5
gpu_thermal_target = 80
# Explicit low PPT values avoid keeping the budget of a previous profile.
cpu = [15, 20, 25]
# Safe relies on PPT and EPP rather than a frequency cap. A fixed cap made
# short interactive bursts slower without saving energy.
cpu_epp = "balance_power"
on_battery = { cpu_epp = "power" }

[profiles."Quiet Gaming"]
# Gaming on the Quiet fan curve that also fits a 100 W USB-C PD charger: on
# external power the battery balance controller trades CPU PPT and the GPU
# clock ceiling to keep the battery gently charging. It stays within the Safe
# GPU envelope, so it needs no conditions. asusd often selects the quiet mode
# on battery, where gaming tuning would only drain it faster.
battery_balance = true
platform_mode = 0
gpu_tgp_offset = 0
gpu_dynamic_boost = 5
gpu_thermal_target = 80
cpu = [15, 20, 25]
cpu_epp = "balance_performance"
on_battery = { cpu_epp = "power" }

[profiles.Gaming]
requires = ["ac"]
platform_mode = 1
gpu_tgp_offset = 25
gpu_dynamic_boost = 15
gpu_thermal_target = 85
cpu = [30, 45, 55]
cpu_epp = "performance"
