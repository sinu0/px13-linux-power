<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.asuslinux.Px13Power"/>
    <allow send_destination="org.asuslinux.Px13Power"/>
  </policy>
  <policy group="wheel">
    <allow send_destination="org.asuslinux.Px13Power"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.asuslinux.Px13Power"/>
  </policy>
</busconfig>
